<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Matheus Luz">
    <title>Jogos</title>
    <link href="/assets/img/iconjv.png" rel="icon">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Acme&family=Jacquard+12+Charted&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    <script src="js/temas.js" defer></script>
</head>

<body>
    <header>
        <h1>Jogos da Velha</h1>
    </header>

    <main>
        <div class="jogos">
            <a class="game-card" href="the-game-of-old/">
                <div class="card-info">
                    <h2>The Game of Old</h2>
                    <p>Jogo da velha 9x9 1v1</p>
                </div>
            </a>
            <a class="game-card" href="classico/">
                <div class="card-info">
                    <h2>Clássico</h2>
                    <p>O Jogo da velha clássico 3x3 1v1</p>
                </div>
            </a>
            <a class="game-card" href="infinito/">
                <div class="card-info">
                    <h2>Infinito</h2>
                    <p>O Jogo da velha infinito 3x3 1v1</p>
                </div>
            </a>
        </div>
        <aside class="temas">
            <select id="opcoesTemas">
                <option value="dark">Dark</option>
                <option value="light">Light</option>
            </select>
            <select id="opcoesCores">
                <option value="laraCian" selected>Laranja / Ciano</option>
                <option value="verdRoxo">Verde / Roxo</option>
                <option value="vermVerd">Vermelho / Verde</option>
                <option value="rosaAzul">Rosa / Azul</option>
            </select>
            <!-- <div class="marcacoesCheck">
                <input type="checkbox" id="marcacoes">
                <label>Marcações</label>
                <i class="fa-solid fa-check"></i>
            </div> -->
        </aside>
    </main>

    <footer>
        <a class="assi" href="https://github.com/Mathluz" target="_blank">Github/MathLuz</a>
    </footer>
</body>

</html>
