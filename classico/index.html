<!DOCTYPE html>
<html lang="pt-br" id="html">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Matheus Luz">
    <title>Clássico</title>
    <link href="../assets/img/iconjv.png" rel="icon">
    <link rel="manifest" href="../manifest.json">
    <link rel="apple-touch-icon" href="../assets/img/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#222222">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="The Game of Old">
    <meta name="application-name" content="The Game of Old">
    <script src="../js/pwa.js" defer></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-dark@5/dark.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="style.css" rel="stylesheet">
    <link href="../componentes.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>
    <script src="../js/temas.js" defer></script>
    <script src="js/cores.js" defer></script>
    <script src="../js/controle.js" defer></script>
    <script src="js/motor.js" defer></script>
    <script src="../js/niveis.js" defer></script>
    <script src="js/bot.js" defer></script>
    <script src="js/jogo.js" defer></script>
</head>

<body>
    <header>
        <a href="../" class="btn-voltar"><i class="fa-solid fa-arrow-left"></i></a>
        <h1>Clássico</h1>
    </header>
    <main>

        <aside class="infos">
            <div class="jogadores">
                <div class="jogadorU">Jogador 1 - <span>X</span></div>
                <div class="jogadorD">Jogador 2 - <span>O</span></div>
            </div>
            <div class="config-jogo">
                <select id="oponente" title="Oponente">
                    <option value="humano">2 jogadores</option>
                    <option value="facil">vs Bot - Fácil</option>
                    <option value="medio">vs Bot - Médio</option>
                    <option value="dificil">vs Bot - Difícil</option>
                </select>
                <select id="ladoHumano" title="Sua peça">
                    <option value="X">Você joga de X</option>
                    <option value="O">Você joga de O</option>
                </select>
            </div>
        </aside>

        <div class="boxgame">
            <button class="btn-reset" onclick="reiniciar()"><i class="fa-solid fa-arrow-rotate-right"></i></button>
            <div class="celula" onclick="jogada(this)" data-pos="0"></div>
            <div class="celula" onclick="jogada(this)" data-pos="1"></div>
            <div class="celula" onclick="jogada(this)" data-pos="2"></div>
            <div class="celula" onclick="jogada(this)" data-pos="3"></div>
            <div class="celula" onclick="jogada(this)" data-pos="4"></div>
            <div class="celula" onclick="jogada(this)" data-pos="5"></div>
            <div class="celula" onclick="jogada(this)" data-pos="6"></div>
            <div class="celula" onclick="jogada(this)" data-pos="7"></div>
            <div class="celula" onclick="jogada(this)" data-pos="8"></div>
        </div>

        <aside class="temas">
            <select id="opcoesTemas">
                <option value="dark">Dark</option>
                <option value="light">Light</option>
            </select>
            <select id="opcoesCores">
                <option value="laraCian" selected>Laranja / Ciano</option>
                <option value="verdRoxo">Verde / Roxo</option>
                <option value="vermVerd">Vermelho / Verde</option>
                <option value="rosaAzul">Rosa / Azul</option>
            </select>
        </aside>
    </main>

    <footer>
        <a class="assi" href="https://github.com/Mathluz" target="_blank" rel="noopener"><i class="fa-brands fa-github"></i> MathLuz</a>
    </footer>
</body>

</html>
